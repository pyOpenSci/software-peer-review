name: deploy-book

on:
  pull_request:
  push:
    branches:
      - main

# This job installs dependencies, build the book, and pushes it to `gh-pages`
jobs:
  build-test-book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Fetch all history to get all tags
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: |
          # install pip=>20.1 to use "pip cache dir"
          python3 -m pip install --upgrade pip
      - name: Get pip cache dir
        id: pip-cache
        run: echo "::set-output name=dir::$(pip cache dir)"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.pip-cache.outputs.dir }}
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: python3 -m pip install nox

      - name: Build book
        run: nox -s docs

        # Push the book's HTML to github-pages
      - name: Push to GitHub Pages
        # Only push if on main branch
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3.9.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: "./_build/html"

      # Test for bad links and ensure alt tags for usability
      - name: Check HTML using htmlproofer
        uses: chabad360/htmlproofer@master
        with:
          directory: ./_build/html
          arguments: |
            --ignore-files "/.+\/_static\/.+/"
            --ignore-status-codes "0, 200, 301, 302, 401, 403, 429, 503"
            --ignore-urls "https://github.com/pyOpenSci/software-review/issues/18#issuecomment-581752433,https://github.com/pyOpenSci/software-review/issues/18#issuecomment-579520816,https://github.com/hpi-dhc/devicely,https://github.com/pyOpenSci/pyos-package-template"
      # Save html as artifact
      - name: Save book html as artifact for viewing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: book-html
          path: |
            ./_build/html
